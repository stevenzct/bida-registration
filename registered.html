<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Registration confirmation · BIDA</title>

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/ticket.css" />
    <script defer src="js/ticket.js"></script>
  </head>
  <body class="ticket-page">
    <main class="ticket" hidden>
      <header
        ><img id="ticket-brand" src="assets/images/brand.webp" alt="BIDA"
      /></header>
      <section class="ticket-content" aria-labelledby="confirmation">
        <img class="check" src="assets/images/registered-check.webp" alt="" />
        <h1 id="confirmation">You are registered!</h1>
        <p
          >Show this confirmation to the BIDA booth team when joining an
          activity.</p
        >
        <div class="reference">
          <label for="code">Your registration code</label>
          <output id="code"></output>
          <small>Demo code generated on submission</small>
        </div>
        <div class="ticket-actions">
          <button type="button" id="save"
            ><span aria-hidden="true">↓</span> Save code image</button
          >
          <a href="index.html#download"
            >Download BIDA <span aria-hidden="true">→</span></a
          >
        </div>
        <p role="status" id="export-status"></p>
        <small
          >Registration is for booth activities, not a BIDA app account.
          Participation and prizes are subject to event rules.</small
        >
      </section>
    </main>
  </body>
</html>
